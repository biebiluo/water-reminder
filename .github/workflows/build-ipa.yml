name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build unsigned app
        run: |
          xcodebuild -project WaterReminder.xcodeproj -scheme WaterReminder -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/WaterReminder.app Payload/
          zip -r WaterReminder.ipa Payload
          ls -lh WaterReminder.ipa
          unzip -l WaterReminder.ipa | head -30
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WaterReminder-ipa
          path: WaterReminder.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" WaterReminder.ipa --title "WaterReminder build ${{ github.run_number }}" --notes "喝水提醒测试版，未签名 IPA，可用直装工具安装测试。"
